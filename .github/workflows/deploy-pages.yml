name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'app.css'
      - 'config.js'
      - 'sw.js'
      - 'site.webmanifest'
      - 'assets/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate application
        run: |
          node --check app.js
          node --check sw.js
          node --test tests/admin-users-policy.test.mjs
          node -e "JSON.parse(require('fs').readFileSync('site.webmanifest','utf8'))"

      - name: Build GitHub Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html app.js app.css config.js sw.js site.webmanifest _site/
          cp -R assets _site/assets
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
