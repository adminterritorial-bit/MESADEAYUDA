name: Deploy static fallback

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'app.css'
      - 'config.js'
      - 'sw.js'
      - 'site.webmanifest'
      - 'assets/**'
      - '.github/workflows/deploy-static.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: static-fallback
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JavaScript and user policy
        run: |
          node --check app.js
          node --check sw.js
          node --test tests/admin-users-policy.test.mjs

      - name: Validate runtime files
        run: |
          test -f index.html
          test -f app.js
          test -f app.css
          test -f config.js
          test -f sw.js
          test -f site.webmanifest
          test -d assets
          node -e "JSON.parse(require('fs').readFileSync('site.webmanifest','utf8'))"

      - name: Build runtime-only site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html app.js app.css config.js sw.js site.webmanifest _site/
          cp -R assets _site/assets
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  pages:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
    steps:
      - name: Detect or enable GitHub Pages
        id: pages_state
        shell: bash
        env:
          DEFAULT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          token="$DEFAULT_TOKEN"
          if [ -n "${PAGES_TOKEN:-}" ]; then
            token="$PAGES_TOKEN"
          fi

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          status="$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $token" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "$api")"

          enabled=false

          if [ "$status" = "200" ]; then
            enabled=true
          elif [ -n "${PAGES_TOKEN:-}" ]; then
            create_status="$(curl -sS -o /tmp/pages-create.json -w "%{http_code}" \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $token" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              -H "Content-Type: application/json" \
              "$api" \
              -d '{"build_type":"workflow"}')"

            if [ "$create_status" = "201" ] || [ "$create_status" = "409" ]; then
              enabled=true
            else
              echo "::warning::No fue posible habilitar Pages con PAGES_TOKEN (HTTP $create_status)."
              cat /tmp/pages-create.json || true
            fi
          else
            echo "::notice::Pages aún no está habilitado. El artefacto fue construido correctamente. Para alta inicial, configura el secreto PAGES_TOKEN con Pages:write + Administration:write o habilita Pages una vez desde Settings."
          fi

          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

      - name: Configure GitHub Pages
        if: steps.pages_state.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
        with:
          token: ${{ secrets.PAGES_TOKEN || github.token }}

      - name: Deploy to GitHub Pages
        if: steps.pages_state.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record fallback state
        if: steps.pages_state.outputs.enabled != 'true'
        run: |
          echo "GitHub Pages no está habilitado todavía; validación y artefacto completados sin publicar." >> "$GITHUB_STEP_SUMMARY"
