name: Deploy static fallback

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'app.css'
      - 'config.js'
      - 'sw.js'
      - 'site.webmanifest'
      - 'assets/**'
      - '.github/workflows/deploy-static.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check sw.js
          node --test tests/admin-users-policy.test.mjs

      - name: Validate runtime files
        run: |
          test -f index.html
          test -f app.js
          test -f app.css
          test -f config.js
          test -f sw.js
          test -f site.webmanifest
          test -d assets
          node -e "JSON.parse(require('fs').readFileSync('site.webmanifest','utf8'))"

      - name: Build runtime-only site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html app.js app.css config.js sw.js site.webmanifest _site/
          cp -R assets _site/assets
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
          token: ${{ secrets.PAGES_TOKEN || github.token }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
