name: Deploy Vercel prebuilt

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'app.css'
      - 'config.js'
      - 'sw.js'
      - 'site.webmanifest'
      - 'assets/**'
      - '.github/workflows/deploy-vercel-prebuilt.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-prebuilt-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: adminterritorial-3830s-projects
      VERCEL_PROJECT: mesadeayuda
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate runtime
        run: |
          node --check app.js
          node --check sw.js
          node --test tests/admin-users-policy.test.mjs
          node -e "JSON.parse(require('fs').readFileSync('site.webmanifest','utf8'))"

      - name: Detect Vercel credential
        id: credential
        shell: bash
        run: |
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN no está configurado. Se omite el deploy prebuilt; la integración Git de Vercel seguirá intentando desplegar main cuando libere su cuota."
          fi

      - name: Link Vercel project
        if: steps.credential.outputs.available == 'true'
        run: |
          npx --yes vercel@59.15.1 link \
            --yes \
            --project "$VERCEL_PROJECT" \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN"

      - name: Pull production configuration
        if: steps.credential.outputs.available == 'true'
        run: |
          npx --yes vercel@59.15.1 pull \
            --yes \
            --environment=production \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN"

      - name: Build on GitHub runner
        if: steps.credential.outputs.available == 'true'
        run: |
          npx --yes vercel@59.15.1 build \
            --prod \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN"

      - name: Deploy prebuilt to production
        if: steps.credential.outputs.available == 'true'
        id: deploy
        shell: bash
        run: |
          url="$(npx --yes vercel@59.15.1 deploy \
            --prebuilt \
            --prod \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Record unavailable credential
        if: steps.credential.outputs.available != 'true'
        run: |
          echo "El código y las pruebas están listos. Para que Actions haga deploy prebuilt a Vercel, agrega el secret VERCEL_TOKEN con acceso al scope adminterritorial-3830s-projects." >> "$GITHUB_STEP_SUMMARY"
