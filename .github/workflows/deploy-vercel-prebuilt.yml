name: Deploy Vercel prebuilt

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'app.css'
      - 'config.js'
      - 'sw.js'
      - 'site.webmanifest'
      - 'assets/**'
      - '.github/workflows/deploy-vercel-prebuilt.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-prebuilt-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: adminterritorial-3830s-projects
      VERCEL_PROJECT: mesadeayuda

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate runtime
        run: |
          node --check app.js
          node --check sw.js
          node --test tests/admin-users-policy.test.mjs
          node -e "JSON.parse(require('fs').readFileSync('site.webmanifest','utf8'))"

      - name: Require Vercel deployment credential
        shell: bash
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN no está configurado en GitHub Secrets. El despliegue real no puede ejecutarse."
            echo "FALLO DE DEPLOY: falta VERCEL_TOKEN con acceso al scope adminterritorial-3830s-projects." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Link Vercel project
        run: |
          npx --yes vercel@59.15.1 link             --yes             --project "$VERCEL_PROJECT"             --scope "$VERCEL_SCOPE"             --token "$VERCEL_TOKEN"

      - name: Pull production configuration
        run: |
          npx --yes vercel@59.15.1 pull             --yes             --environment=production             --scope "$VERCEL_SCOPE"             --token "$VERCEL_TOKEN"

      - name: Build on GitHub runner
        run: |
          npx --yes vercel@59.15.1 build             --prod             --scope "$VERCEL_SCOPE"             --token "$VERCEL_TOKEN"

      - name: Deploy prebuilt to production
        id: deploy
        shell: bash
        run: |
          url="$(npx --yes vercel@59.15.1 deploy             --prebuilt             --prod             --scope "$VERCEL_SCOPE"             --token "$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $url" >> "$GITHUB_STEP_SUMMARY"
